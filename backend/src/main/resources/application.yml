spring:
  application:
    name: salary-management
  datasource:
    url: ${DB_URL:jdbc:sqlite:./data/salary.db?journal_mode=WAL&busy_timeout=5000}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1   # SQLite allows a single writer; see ADR-0003
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate     # schema is owned by Flyway migrations
    database-platform: org.hibernate.community.dialect.SQLiteDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
